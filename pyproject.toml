[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-ai-lab"
version = "0.1.0"
description = "A learning project for channel sales intelligence using synthetic data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
forecast = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]
dashboard = ["streamlit>=1.30", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
